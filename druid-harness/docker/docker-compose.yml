# Apache Druid 35.0.0 single-node cluster for the query harness.
# On-demand only: no restart policy. Stop with `make down` when idle.
#
# Overlord is colocated with Coordinator (nano-quickstart coordinator-overlord).
# Metadata store is PostgreSQL 16 (embedded Derby cannot be shared across
# these containers). Deep storage is a local Docker volume.
#
# Druid services use a locally built image (official 35.0.0 tarball + Temurin
# 17). Docker Hub's apache/druid:35.0.0 is linux/amd64 only and will not start
# on this ARM64 DGX Spark.

name: druid-harness

x-druid: &druid-image
  image: druid-harness:35.0.0
  build:
    context: .
    dockerfile: Dockerfile

volumes:
  metadata_data: {}
  middle_var: {}
  historical_var: {}
  broker_var: {}
  coordinator_var: {}
  router_var: {}
  druid_shared: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: druid-harness-postgres
    mem_limit: 512m
    volumes:
      - metadata_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: FoolishPassword
      POSTGRES_USER: druid
      POSTGRES_DB: druid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid -d druid"]
      interval: 5s
      timeout: 5s
      retries: 12

  zookeeper:
    image: zookeeper:3.8.4
    container_name: druid-harness-zookeeper
    mem_limit: 512m
    environment:
      ZOO_MY_ID: 1
      ZOO_HEAP_SIZE: 256m

  coordinator:
    <<: *druid-image
    container_name: druid-harness-coordinator
    mem_limit: 768m
    volumes:
      - druid_shared:/opt/shared
      - coordinator_var:/opt/druid/var
      - ../data:/opt/shared/harness
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8081"
    command:
      - coordinator
    env_file:
      - environment

  broker:
    <<: *druid-image
    container_name: druid-harness-broker
    # The nano-quickstart 512m heap OOM-killed the broker under the dataset generator's concurrent
    # queries (10 workers, wide tables, large scan results). Sized up: this host has ~100 GB free.
    mem_limit: 6g
    environment:
      - DRUID_XMX=4g
      - DRUID_XMS=1g
      - DRUID_MAXDIRECTMEMORYSIZE=1g
    volumes:
      - broker_var:/opt/druid/var
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
      coordinator:
        condition: service_started
    command:
      - broker
    env_file:
      - environment

  historical:
    <<: *druid-image
    container_name: druid-harness-historical
    mem_limit: 5g
    environment:
      - DRUID_XMX=3g
      - DRUID_XMS=1g
      - DRUID_MAXDIRECTMEMORYSIZE=1g
    volumes:
      - druid_shared:/opt/shared
      - historical_var:/opt/druid/var
      - ../data:/opt/shared/harness
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
      coordinator:
        condition: service_started
    command:
      - historical
    env_file:
      - environment

  middlemanager:
    <<: *druid-image
    container_name: druid-harness-middlemanager
    mem_limit: 2g
    volumes:
      - druid_shared:/opt/shared
      - middle_var:/opt/druid/var
      - ../data:/opt/shared/harness
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
      coordinator:
        condition: service_started
    command:
      - middleManager
    env_file:
      - environment

  router:
    <<: *druid-image
    container_name: druid-harness-router
    mem_limit: 512m
    volumes:
      - router_var:/opt/druid/var
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
      coordinator:
        condition: service_started
    ports:
      - "127.0.0.1:8888:8888"
    command:
      - router
    env_file:
      - environment
